<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inventario móvil</title><style>
*{box-sizing:border-box}body{margin:0;background:#f4f1e7;color:#09251c;font-family:system-ui,sans-serif}.wrap{max-width:620px;margin:auto;padding:18px}header{background:#073c2e;color:white;padding:20px;border-radius:16px;margin-bottom:14px}h1{margin:0;font-size:25px}p{line-height:1.4}.card{background:white;padding:17px;border:1px solid #ded7c6;border-radius:15px;margin:12px 0}label{display:block;font-weight:700;margin:10px 0 6px}input,textarea,button{width:100%;font:inherit;border-radius:10px}input,textarea{border:1px solid #bfb8a7;padding:13px}textarea{min-height:180px;resize:vertical}button{border:0;padding:14px;font-weight:800;background:#08795b;color:white;margin-top:12px}button.secondary{background:#e9e3d4;color:#173c30}button.danger{background:#a82d2d}button:disabled{opacity:.5}.row{border-bottom:1px solid #eee5d8;padding:11px 0}.ok{color:#08795b}.bad{color:#b42318}.muted{color:#61746c;font-size:13px}.hidden{display:none}.message{padding:12px;border-radius:10px;background:#eef8f4}.error{background:#fff0f0;color:#8d1f1f}</style></head><body><div class="wrap"><header><h1>Inventario móvil</h1><p>Ajustes protegidos · Minimarket 24/7</p></header>
<section id="login" class="card"><h2>Iniciar sesión</h2><label>Usuario</label><input id="user" autocomplete="username"><label>Contraseña</label><input id="pass" type="password" autocomplete="current-password"><button id="loginBtn">Entrar</button></section>
<main id="app" class="hidden"><section class="card"><label>Cantidad predeterminada</label><input id="defaultQty" type="number" value="3" step="0.001"><label>Productos, uno por línea</label><textarea id="text" placeholder="Coca-Cola personal&#10;Salvavidas lata +5&#10;Producto a rebajar -2"></textarea><p class="muted">Si una línea no lleva cantidad se usará la predeterminada.</p><button id="previewBtn">Revisar antes de cambiar</button><button id="logoutBtn" class="secondary">Cerrar sesión</button></section><section id="results" class="card hidden"><h2>Vista previa</h2><div id="rows"></div><button id="applyBtn" class="danger">Confirmar cambios</button></section><div id="msg"></div></main></div><script>
let token=localStorage.getItem('inventoryToken'),ready=[];const $=id=>document.getElementById(id);const h=v=>String(v??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#39;'}[c]));function showApp(){ $('login').classList.toggle('hidden',!!token);$('app').classList.toggle('hidden',!token)}showApp();async function api(path,body){const r=await fetch('/api/inventario-movil/'+path,{method:'POST',headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{})},body:JSON.stringify(body)});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'No se pudo completar.');return b}function message(t,e=false){$('msg').innerHTML='<p class="message '+(e?'error':'')+'">'+t.replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))+'</p>'}
$('loginBtn').onclick=async()=>{try{const r=await fetch('/api/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({usuario:$('user').value,contrasena:$('pass').value})});const b=await r.json();if(!r.ok)throw Error(b.error);if(b.usuario.rol!=='ADMINISTRADOR')throw Error('Solo administradores.');token=b.token;localStorage.setItem('inventoryToken',token);showApp()}catch(e){alert(e.message)}};
function items(){const q=Number($('defaultQty').value);return $('text').value.split(/\n/).map(x=>x.trim()).filter(Boolean).map(line=>{const m=line.match(/\s([+-]\d+(?:[.,]\d{1,3})?)\s*$/);return {nombre:m?line.slice(0,m.index).trim():line,cantidad:m?Number(m[1].replace(',','.')):q}})}
$('previewBtn').onclick=async()=>{try{const r=await api('preview',{items:items()});ready=r.resultados.filter(x=>x.estado==='LISTO');$('rows').innerHTML=r.resultados.map(x=>`<div class="row ${x.estado==='LISTO'?'ok':'bad'}"><b>${h(x.nombreEncontrado||x.nombre)}</b><br>${x.estado==='LISTO'?`${x.stockActual} → <b>${x.stockNuevo}</b> ${x.unidad} (${x.cantidad>0?'+':''}${x.cantidad})`:x.estado+(x.coincidencias?.length?': '+h(x.coincidencias.map(c=>c.nombre).join(', ')):'')}</div>`).join('');$('applyBtn').disabled=ready.length!==r.resultados.length;$('results').classList.remove('hidden');message('Revisa cada línea antes de confirmar.')}catch(e){message(e.message,true)}};
$('applyBtn').onclick=async()=>{if(!confirm('¿Aplicar estos cambios al inventario?'))return;try{const r=await api('aplicar',{items:ready.map(x=>({nombre:x.nombreEncontrado,productoId:x.productoId,cantidad:x.cantidad}))});message('Cambios aplicados: '+r.resultados.length);$('results').classList.add('hidden');$('text').value=''}catch(e){message(e.message,true)}};
$('logoutBtn').onclick=()=>{localStorage.removeItem('inventoryToken');token=null;showApp()};
</script></body></html>
